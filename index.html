<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<meta name="description" content="接案收入記錄：排班月曆、收入統計與入帳記錄，資料只存在你的裝置。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="接案收入">
<title>接案收入</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400&display=swap">
<style>
:root{--lt:block;--dk:none;--hl:none;--hd:block;--washi:#FAF8F4;--ink:#1C1C1C;--red:#B7282E;--g1:#F1EEE8;--g2:#E7E2D9;--g3:#DCD6CB;--muted:#6B6B6B;--sub:#3A3A3A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--washi);color:var(--ink)}
body{font-family:'Inter','Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 24px calc(112px + env(safe-area-inset-bottom))}
.serif{font-family:'Noto Serif TC',serif;font-weight:300}
.cap{font-size:15px;letter-spacing:.04em;font-weight:500}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.iconbtn.soft{background:var(--g1)}
.iconbtn:disabled{color:#BDB6A8;cursor:default}
.link{border:none;background:transparent;padding:0;min-height:44px;text-decoration:underline;text-underline-offset:4px;font-size:14px}
h1.title{margin:0;font-size:34px;letter-spacing:-.02em}
.big{font-size:56px;letter-spacing:-.04em;line-height:1.05}
.sec{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.bar{position:relative;height:2px;background:var(--g2);margin-top:14px}
.bar i{position:absolute;left:0;top:0;height:2px;background:var(--red);transition:width 1s ease}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;margin-top:6px}
.cell{position:relative;height:50px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;transition:transform .2s}
.cell:active{transform:scale(.9)}
.cell .d{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums;transition:background .5s ease,color .5s ease}
.cell.today .d{width:36px;height:36px;background:var(--red);color:#fff;font-weight:500}
.cell.past .d{color:var(--sub)}
.cell .mks{display:flex;gap:2px;height:9px;margin-top:-3px}
.cell .pay{position:absolute;top:2px;right:2px;line-height:0;color:var(--red)}
.cell.blank{visibility:hidden}
.cell.on .d{background:var(--ink);color:var(--washi);animation:ink .5s ease-out}
.cell.today.on .d{background:var(--ink);box-shadow:0 0 0 2px var(--red)}
.cell.fresh .d{animation:ink 1.1s ease-out}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.pr{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--g2)}
.pr .dd{width:42px;text-align:center}
.pr.over .dd b{color:var(--red)}
.chk{width:32px;height:32px;border-radius:50%;border:1px solid var(--ink);background:var(--washi);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s ease,color .2s ease;position:relative}
.chk::before{content:'';position:absolute;inset:-6px}
.chk.done{background:var(--ink);color:var(--washi)}
.chk.done svg{animation:pop .25s ease-out}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--g1);color:var(--sub)}
.tag.red{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(78px + env(safe-area-inset-bottom));padding:0 24px env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-between;background:var(--washi);border-top:1px solid var(--g2);z-index:10}
.tabs .t{display:flex;gap:28px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;font-size:15px;color:var(--muted);text-decoration:none}
.tabs a i{width:4px;height:4px;border-radius:50%;display:block}
.tabs a.on{color:var(--ink);font-weight:500}
.tabs a.on i{background:var(--red)}
.fab{height:52px;padding:0 20px 0 16px;gap:6px;font-size:15px;font-weight:500;border-radius:26px;border:none;background:var(--ink);color:var(--washi);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab:active{transform:scale(.92)}
.pl{min-height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--g3);background:var(--washi);display:inline-flex;align-items:center;gap:8px;font-size:14px;transition:background .5s ease,color .5s ease}
.pl.on{background:var(--ink);color:var(--washi);border-color:var(--ink)}
.pl.dash{border-style:dashed}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--g1);border-radius:22px;padding:3px;margin-top:10px}
.seg button{height:38px;border:none;border-radius:19px;background:transparent;color:var(--sub);font-size:14px;transition:background .5s ease,color .5s ease}
.seg button.on{background:var(--ink);color:var(--washi)}
.seg.sm{width:150px;margin-top:0}
.seg.sm button{height:32px;font-size:13px}
.lb{display:block;font-size:17px;color:var(--ink);font-weight:500}
.hint{display:block;font-size:13px;color:var(--muted);margin-top:14px}
.st{width:40px;height:40px;border-radius:50%;border:1px solid var(--g3);background:var(--washi);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.st:active{transform:scale(.9)}
.box{background:var(--g1);border-radius:16px;padding:14px;margin-top:10px}
.tc{height:48px;border-radius:14px;border:1px solid var(--g3);background:var(--washi);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-variant-numeric:tabular-nums;transition:background .5s ease,color .5s ease}
.tc.on{background:var(--ink);color:var(--washi);border-color:var(--ink)}
.tc.add{border-style:dashed;color:var(--sub)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.kb{height:52px;border:none;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .5s ease,color .5s ease}
.kb span{font-size:12px}
.kb.on{background:var(--ink);color:var(--washi)}
.kg.hide .kb{height:52px}.kg.hide .kb span{display:none}
.sw{display:flex;align-items:center;gap:8px;min-height:44px;border:none;background:transparent;padding:0}
.sw b{width:40px;height:24px;border-radius:12px;background:var(--g3);position:relative;display:block;transition:background .5s ease}
.sw b::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--washi);transition:transform .5s ease}
.sw.on b{background:var(--ink)}.sw.on b::after{transform:translateX(16px)}
input.tx{width:100%;height:48px;border:none;border-bottom:1px solid var(--ink);background:transparent;font-family:'Noto Serif TC',serif;font-size:22px;font-weight:300;padding:0;outline:none;margin-top:6px;border-radius:0}
input.tx::placeholder{color:#8C8C8C}
.field{width:100%;height:44px;border:1px solid var(--g3);background:var(--washi);border-radius:12px;padding:0 12px;outline:none}
textarea.field{height:80px;padding:10px 12px;resize:vertical}
.field:focus,input.tx:focus{border-color:var(--ink)}
.go{width:100%;height:56px;border-radius:28px;border:none;background:var(--ink);color:var(--washi);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .5s}
.go:active{transform:scale(.98)}
.go.off{background:var(--g2);color:var(--muted)}
.go.line{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.go.danger{background:var(--red);color:#fff}
.card{background:var(--ink);color:var(--washi);border-radius:22px;padding:20px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.card .k{color:#E07A7E;font-size:13px;letter-spacing:.08em}
.case{border-top:1px solid var(--g2)}
.case>button{width:100%;display:flex;align-items:center;gap:14px;padding:18px 0;border:none;background:transparent;text-align:left}
.case .chev{transition:transform .6s ease}
.case.open .chev{transform:rotate(90deg)}
.det{padding:0 0 22px;animation:ink .7s ease-out}
.stat{background:var(--g1);border-radius:14px;padding:14px}
.sqs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.sq{height:34px;border-radius:6px;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:12px;color:#8C8C8C;font-variant-numeric:tabular-nums}
.sq.w{background:var(--ink);color:var(--washi);font-weight:500;animation:pop .45s ease-out both}
button.sq{border:none;padding:0;cursor:pointer}
.sq.t{background:var(--washi);color:var(--red);font-weight:500;box-shadow:inset 0 0 0 1.5px var(--red)}
.sq.w.t{background:var(--red);color:#fff;box-shadow:none}
.sq.e{background:transparent}
.chart{position:relative;display:flex;gap:6px;align-items:flex-end;border-bottom:1px solid var(--ink);margin-top:6px;touch-action:pan-y;user-select:none}
.bc{flex:1;height:170px;display:flex;flex-direction:column;justify-content:flex-end;border:none;background:transparent;padding:0}
.bc i{display:block;width:100%;border-radius:4px 4px 0 0;background:#D6D0C4;transition:height 1s ease,background .5s ease}
.bc.sel i{background:#6B6B6B}
.bc.cur i{background:var(--red)}
.bc.fut i{background:transparent;border:1px dashed #BDB6A8;border-bottom:none}
.avg{position:absolute;left:0;right:0;border-top:1.5px dashed #9E9E9E;pointer-events:none;transition:bottom 1s ease}
.avg span{position:absolute;right:0;top:3px;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.ml{display:flex;gap:6px;margin-top:6px}
.ml span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.it{width:100%;min-height:60px;display:flex;align-items:center;gap:14px;border:none;border-top:1px solid var(--g2);background:transparent;padding:0;text-align:left}
.it:last-child{border-bottom:1px solid var(--g2)}
.it .f{flex:1;font-size:15px}
.scrim{position:fixed;inset:0;background:rgba(28,28,28,.38);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .4s ease}
.scrim.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:480px;max-height:94dvh;overflow-y:auto;background:var(--washi);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:rise .55s cubic-bezier(.2,.8,.2,1)}
.scrim.center .sheet{border-radius:22px;max-width:360px;padding:22px;animation:ink .5s ease-out}
.grab{width:36px;height:4px;border-radius:2px;background:var(--g3);margin:0 auto 6px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--washi);border-radius:14px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:13px;z-index:50;animation:ink .6s ease-out}
.toast button{border:none;background:transparent;color:var(--washi);text-decoration:underline;text-underline-offset:3px;min-height:32px;padding:0}
.empty{border-radius:18px;display:flex;align-items:center;justify-content:center;padding:28px 16px;margin-top:14px;animation:ink 1s ease-out}
.empty>div{background:var(--washi);padding:14px 22px;border-radius:14px;text-align:center}
.float{position:absolute;right:0;top:30px;font-size:15px;font-weight:500;color:var(--red);animation:floatup 2s ease-out forwards;pointer-events:none}
.ink{animation:ink .8s ease-out}
.slideL{animation:slideL .8s ease}.slideR{animation:slideR .8s ease}
.dline{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--g2)}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:16px}
@keyframes ink{0%{opacity:0;filter:blur(3px);transform:scale(.92)}100%{opacity:1;filter:none;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
@keyframes slideL{from{opacity:0;filter:blur(2px);transform:translateX(-24px)}to{opacity:1;filter:none;transform:none}}
@keyframes slideR{from{opacity:0;filter:blur(2px);transform:translateX(24px)}to{opacity:1;filter:none;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* sticky headers */
.top{position:sticky;top:0;z-index:8;background:var(--washi);margin:0 -24px;padding:calc(env(safe-area-inset-top) + 10px) 24px 8px;transition:box-shadow .3s}
.top.scrolled{box-shadow:0 1px 0 var(--g2)}
.mini{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.mini>div{overflow:hidden}
.top.compact .mini{grid-template-rows:1fr}
.mini .in{position:relative;padding:4px 0 6px}
.toprow{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.toprow h1{margin:0;font-size:26px}
.addbtn{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--ink);background:var(--washi);display:inline-flex;align-items:center;gap:6px;font-size:14px}
.sheet{padding-top:0}
.sh-head{position:sticky;top:0;z-index:3;background:var(--washi);margin:0 -20px;padding:10px 20px 8px;display:flex;flex-direction:column}
.sh-head.line{box-shadow:0 1px 0 var(--g2)}
.sh-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));z-index:3;background:var(--washi);margin:16px -20px calc(-24px - env(safe-area-inset-bottom));padding:12px 20px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--g2)}
/* time input */
input.time{height:46px;border:1px solid var(--g3);border-radius:12px;background:var(--washi);padding:0 10px;font-family:'Noto Serif TC',serif;font-size:19px;font-variant-numeric:tabular-nums;width:100%;min-width:0;text-align:center;-webkit-appearance:none;appearance:none}
input.time:focus{outline:none;border-color:var(--ink)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);gap:6px;align-items:center}
.trow>span{text-align:center;color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 92px 32px;gap:6px;align-items:center;padding:6px 0}
.money{height:46px;border:1px solid var(--g3);border-radius:12px;background:var(--washi);padding:0 8px;text-align:right;font-variant-numeric:tabular-nums;width:100%;min-width:0;font-size:16px}
.money:focus{outline:none;border-color:var(--ink)}
.step-t{display:flex;align-items:center;gap:8px;margin-top:22px}
.step-t b{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--washi);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0}
.step-t span{font-size:15px;font-weight:500}
.desc{font-size:13px;color:var(--muted);margin:4px 0 0 30px}
.result{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--g1);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card input.cname{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(250,248,244,.35);color:var(--washi);font-family:'Noto Serif TC',serif;font-size:28px;font-weight:300;padding:2px 0 4px;outline:none;border-radius:0}
.card input.cname::placeholder{color:rgba(250,248,244,.5)}
.card input.cname:focus{border-bottom-color:var(--washi)}
/* glass art */
.art{position:relative;width:190px;height:136px;margin:0 auto}
.art i{position:absolute;display:block}
.art .b1{width:118px;height:98px;left:8px;top:18px;background:#E2DBCF;border-radius:58% 42% 52% 48%/48% 56% 44% 52%;animation:drift 14s ease-in-out infinite}
.art .b2{width:66px;height:60px;right:18px;top:8px;background:var(--red);opacity:.9;border-radius:46% 54% 38% 62%/58% 42% 58% 42%;animation:drift 11s ease-in-out infinite reverse}
.art .b3{width:96px;height:78px;left:66px;top:46px;background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(28,28,28,.06);border-radius:44% 56% 62% 38%/52% 38% 62% 48%;animation:drift 16s ease-in-out infinite}
.art img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:none}
.art.okl i{display:var(--hl)}.art.okd i{display:var(--hd)}.art.okl.okd i{display:none}
.art.okl .il{display:var(--lt)}.art.okd .id{display:var(--dk)}
.art.sm{transform:scale(.72);height:110px;margin-top:-6px}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(3px,-4px) rotate(4deg)}}
.blank-state{text-align:center;padding:26px 0 8px;animation:ink 1s ease-out}
.blank-state .t{font-family:'Noto Serif TC',serif;font-size:19px;margin-top:8px}
.blank-state .s{font-size:13px;color:var(--muted);margin-top:4px}
.edit{background:var(--g1);border-radius:16px;padding:14px;margin:4px 0 12px;animation:ink .5s ease-out}
.dline.tap{cursor:pointer}
.still .ink,.still .edit,.still .blank-state{animation:none}
@keyframes tick{0%{transform:translateY(0)}40%{transform:translateY(-4px) scale(1.1)}100%{transform:none}}
.tick{animation:tick .4s ease-out}
.rl{display:block;margin-top:3px;color:var(--ink);font-size:13px}
.rl:empty{display:none}
/* 字級規則：不低於 12px；灰色說明 13px；內文 15px；區塊標題 17px；彈出頁標題 24px */
[style*="font-size:10px"],[style*="font-size:11px"]{font-size:12px!important}
[style*="font-size:12px"]{font-size:13px!important}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--g3);background:var(--washi);font-size:13px}
.chip.on{background:var(--ink);color:var(--washi);border-color:var(--ink)}
.tpick{position:relative;height:46px;border:1px solid var(--g3);border-radius:12px;background:var(--washi);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;min-width:0}
.tpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:none;padding:0;margin:0}
.tpick:focus-within{border-color:var(--ink);box-shadow:0 0 0 2px rgba(28,28,28,.08)}
.trow>span{font-size:13px}
.mbox{position:relative;display:block;min-width:0}
.mbox .money{padding-right:28px}
.mbox span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.prow{grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 104px 32px}
.prow>span{font-size:13px}
body.has-sheet .toast{bottom:auto;top:calc(env(safe-area-inset-top) + 14px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pl{white-space:nowrap;flex-shrink:0}
.chip{white-space:nowrap}
.chip.dash{border-style:dashed;color:var(--sub)}
.sl{font-size:15px;font-weight:500;margin-top:18px}

<body>
<main class="app" id="app"></main>
<div id="nav"></div>
<div id="sheet"></div>
<div id="dlg"></div>
<div id="toast" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ---------- storage ---------- */
const KEY = 'shiftbook-v1';
let store = null;
try { store = window.localStorage; store.setItem('__t', '1'); store.removeItem('__t'); } catch (e) { store = null; }
const DEF_RATES = () => [
  { id: 'cny', name: '過年', mult: 2, auto: true },
  { id: 'typhoon', name: '颱風假', mult: 1.5, scope: 'day' },
  { id: 'nyl', name: '年假', mult: 1.5, scope: 'day' },
  { id: 'abroad', name: '出國', mult: 1.5 },
  { id: 'lang', name: '外語', mult: 1.5, scope: 'day' },
  { id: 'langc', name: '語言', mult: 1.5, scope: 'case' },
  
];
function emptyDb() { return { v: 2, sources: [], cases: [], shifts: [], payments: [], settings: { kamonNames: true, rates: DEF_RATES(), allowNames: ['伙食', '交通', '語言'], v3: true } }; }
function migrate(d) {
  const e = emptyDb(); for (const k in e) if (d[k] == null) d[k] = e[k];
  d.settings = Object.assign({ kamonNames: true }, d.settings);
  if (!Array.isArray(d.settings.rates) || !d.settings.rates.length) { d.settings.rates = DEF_RATES(); d.settings.v3 = true; }
  if (!d.settings.v3) {
    const R = d.settings.rates;
    DEF_RATES().forEach(x => { if (!R.some(r => r.id === x.id)) R.push(x); });
    R.forEach(r => { if (r.id === 'typhoon') r.scope = 'day'; if (r.id === 'lang' && r.name === '語言加給') { r.name = '外語'; r.scope = 'day'; } });
    const di = R.findIndex(r => r.id === 'dbl' && r.name === '倍薪' && r.mult === 2); if (di >= 0) R.splice(di, 1);
    d.settings.v3 = true;
  }
  if (!Array.isArray(d.settings.allowNames)) d.settings.allowNames = ['伙食', '交通', '語言'];
  d.cases = d.cases.map(migrateCase).map(c => {
    c.rates = (Array.isArray(c.rates) ? c.rates : []).map(x => { if (typeof x !== 'string') return x; const g = d.settings.rates.find(r => r.id === x); return g ? { id: g.id, n: g.name, m: g.mult } : null; }).filter(Boolean);
    if (!Array.isArray(c.allows)) c.allows = c.allowance > 0 ? [{ n: '加給', v: c.allowance }] : [];
    c.allowance = sumAllow(c.allows); return c;
  });
  d.shifts = d.shifts.map(migrateShift);
  return d;
}
/* 舊資料的「倍薪」改成費率標籤；金額維持原樣 */
function migrateShift(s) {
  if (!Array.isArray(s.rt)) s.rt = s.double ? [isCNY(s.date) ? { id: 'cny', n: '過年', m: 2 } : { id: 'dbl', n: '倍薪', m: 2 }] : [];
  if (s.allowance == null) s.allowance = 0;
  if (!Array.isArray(s.allows)) s.allows = s.allowance > 0 ? [{ n: '加給', v: s.allowance }] : [];
  delete s.double;
  return s;
}
const H0 = () => ({ dayStart: 480, dayEnd: 1200, dayRate: 0, nightRate: 0 });
function migrateCase(c) {
  if (c.payType === 'shift') {
    c.payType = 'time';
    c.presets = (c.presets || []).map(p => ({ id: p.id || uid(), start: p.start, end: p.end != null ? p.end : (p.start + 720) % 1440, amount: p.amount }));
    c.hourly = c.hourly && c.hourly.dayRate != null ? { dayStart: c.hourly.dayStart, dayEnd: c.hourly.dayEnd, dayRate: c.hourly.dayRate || 0, nightRate: c.hourly.nightRate || 0 } : H0();
    c.work = c.work || (c.presets[0] ? { start: c.presets[0].start, end: c.presets[0].end } : { start: 480, end: 1200 });
  } else if (c.payType === 'hour') {
    const h = c.hourly; c.payType = 'time'; c.presets = [];
    c.work = { start: h.ws, end: h.we }; c.hourly = { dayStart: h.dayStart, dayEnd: h.dayEnd, dayRate: h.dayRate, nightRate: h.nightRate };
  } else {
    c.presets = c.presets || []; c.hourly = c.hourly && c.hourly.dayRate != null ? c.hourly : H0();
    c.work = c.work || { start: 480, end: 1200 };
    if (c.payType === 'once' && c.onceTime === undefined) c.onceTime = null;
  }
  return c;
}
function loadDb() {
  try { const s = store && store.getItem(KEY); if (s) return migrate(JSON.parse(s)); } catch (e) {}
  return emptyDb();
}
let db = null;
function save() {
  if (!store) return;
  try { store.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('這個瀏覽器無法儲存資料，請記得匯出備份'); }
}

/* ---------- utils ---------- */
const pad = n => (n < 10 ? '0' : '') + n;
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const a = s.split('-'); return new Date(+a[0], a[1] - 1, +a[2]); };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const todayD = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const wd0 = d => (d.getDay() + 6) % 7;
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const money = n => Math.round(n).toLocaleString('en-US');
const hm = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const WD = ['一', '二', '三', '四', '五', '六', '日'];
const MON = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const mkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const md = s => (+s.slice(5, 7)) + '/' + (+s.slice(8, 10));
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- rules ---------- */
// 農曆正月初一；除夕到初五自動倍薪
const CNY = { 2025: '2025-01-29', 2026: '2026-02-17', 2027: '2027-02-06', 2028: '2028-01-26', 2029: '2029-02-13', 2030: '2030-02-03' };
function isCNY(ds) {
  const d1 = CNY[+ds.slice(0, 4)]; if (!d1) return false;
  const s = ymd(addD(pd(d1), -1)), e = ymd(addD(pd(d1), 4));
  return ds >= s && ds <= e;
}
const inDay = (m, h) => h.dayStart < h.dayEnd ? (m >= h.dayStart && m < h.dayEnd) : (m >= h.dayStart || m < h.dayEnd);
const durM = (s, e) => ((((e - s) % 1440) + 1440) % 1440) || 1440;
const r2 = x => Math.round(x * 100) / 100;
function hourCalc(h, ws, we) {
  const dur = durM(ws, we);
  let dm = 0, nm = 0;
  for (let t = 0; t < dur; t += 5) { if (inDay((ws + t) % 1440, h)) dm += 5; else nm += 5; }
  return { dh: r2(dm / 60), nh: r2(nm / 60), amount: Math.round(dm / 60 * h.dayRate + nm / 60 * h.nightRate) };
}
const toMin = v => { const a = String(v || '').split(':'); return a.length < 2 ? null : (+a[0]) * 60 + (+a[1]); };
const hrs = (s, e) => r2(durM(s, e) / 60);

/* ---------- 費率與加給 ---------- */
/* 多個費率「相加」：過年 ×2 ＋ 出國 ×2 ＝ ×3。每日加給是固定金額，不跟著倍數。 */
const fx = x => String(r2(x));
function rateOf(id, snap) {
  const s = snap && snap.find(x => x.id === id); if (s) return s;
  const g = db.settings.rates.find(x => x.id === id); return g ? { id: g.id, n: g.name, m: g.mult } : null;
}
function ratesFor(ds, ids, snap) {
  const set = ids.slice();
  if (ds && isCNY(ds) && !set.some(r => r.id === 'cny')) set.push(rateOf('cny', snap));
  return set.filter(Boolean);
}

/* ---------- 出勤與休假統計：休＝沒有班的日子，只算到今天 ---------- */
function workSet() { const s = {}; for (const x of db.shifts) s[x.date] = 1; return s; }
function firstWork() { let m = ''; for (const x of db.shifts) if (!m || x.date < m) m = x.date; return m; }
function monthPlan(y, mo) {
  const ws = workSet(), n = dim(y, mo); let work = 0;
  for (let d = 1; d <= n; d++) if (ws[y + '-' + pad(mo + 1) + '-' + pad(d)]) work++;
  return { n, work, rest: n - work };
}
function workStats(y, mo, ws, first) {
  const T = todayD(), n = dim(y, mo); let last = n;
  if (y === T.getFullYear() && mo === T.getMonth()) last = T.getDate(); else if (new Date(y, mo, 1) > T) last = 0;
  let st = 1; if (first) { const fy = +first.slice(0, 4), fm = +first.slice(5, 7) - 1; if (y < fy || (y === fy && mo < fm)) last = 0; else if (y === fy && mo === fm) st = +first.slice(8); }
  if (last < st) return { days: 0, work: 0, rest: 0, n };
  let work = 0; for (let d = st; d <= last; d++) if (ws[y + '-' + pad(mo + 1) + '-' + pad(d)]) work++;
  return { days: last - st + 1, work, rest: last - st + 1 - work, n };
}
function yearWork(y) {
